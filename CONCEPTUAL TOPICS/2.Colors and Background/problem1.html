<!DOCTYPE html>
<html>
    <head>
        <style>
            /*Style the navigation bar*/
            .navbar{
                background-color: #192a26;
                padding: 10px;
                display: flex;
                justify-content: center;
            }
            /*Style the navigation bar items*/
            .navbar-item{
                margin: 0 10px;
                color: #f5f6fa;
                font-size: 16px;
                text-decoration: none;
            }
            /*Hover effect for the navigation bar items*/
            .navbar-item:hover{
                color: #273c75;
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <a href="#"class="navbar-item">About</a>
            <a href="#"class="navbar-item">Services</a>
            <a href="#"class="navbar-item">Contact</a>
        </div>
    </body>
</html>

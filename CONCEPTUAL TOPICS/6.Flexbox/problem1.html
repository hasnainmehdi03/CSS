<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Float Layout Example</title>
        <link rel="stylesheet" href="problem1.css">
    </head>
    <body>
        <header class="header">
            <h1>Float Layout Example</h1>
        </header>
        <div class="content">
            <div class="sidebar">
                <h2>Sidebar</h2>
                <ul>
                    <li>Item 1</li>
                    <li>Item 2</li>
                    <li>Item 3</li>
                    <li>Item 4</li>
                </ul>
            </div>
            <div class="main-content">
                <h2>Main Content</h2>
                <p>This is the main content of the layout. It will take the remaining space after the sidebar. The content here can be longer and will wrap around the sidebar</p>
            </div>
        </div>
        <footer class="footer">
            <p>@2023 Float Layout Example</p>
        </footer>
    </body>
</html>

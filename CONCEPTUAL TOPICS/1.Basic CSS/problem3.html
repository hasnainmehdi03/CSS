<!--Create a CSS class one and verify that it works on multiple elements-->
<!DOCTYPE html>
<html>
    <head>
        <style>
            .one{
                color: blue;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h1 class="one">Heading 1</h1>
        <p class="one">Paragraph 1</p>
        <h2 class="one">Heading 2</h2>
        <p class="one">Paragraph 2</p>
    </body>
</html>

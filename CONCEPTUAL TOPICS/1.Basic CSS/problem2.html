<!--Create an element with id head and verify that background color works on it as inline, external as well as using style tag css-->
<!DOCTYPE html>
<html>
    <head>
        <title>Background Color Example</title>
        <style>
            #head{
                background-color:green;
                color: white;
            }
        </style>
    </head>
    <body>
        <h1 id="head" style="background-color:blue";>Inline Background Color</h1>
        <h2 id="head">External Background Color</h2>
        <h3 id="head" style="background-color:red";>Style Tag Background Color</h3>
    </body>
</html>

<!--Create Multiple CSS Classes and verify that all of these work on the same element-->
<!DOCTYPE html>
<html>
    <head>
        <style>
            .class1{
                color:red;
                font-weight:bold;
            }
            .class2{
                background-color: yellow;
                padding: 10px;
            }
            .class3{
                border: 1px solid black;
                margin: 10px;
            }
        </style>
    </head>
    <body>
        <div class="class1 class2 class3">
            This is a div element with multiple css classes applied it
        </div>
    </body>
</html>

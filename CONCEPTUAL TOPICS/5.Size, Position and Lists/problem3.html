<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>List Style Example</title>
        <link rel="stylesheet" href="problem3.css">
    </head>
    <body>
        <h2>Unordered List (ul) Example:</h2>
        <ul class="unordered-list">
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
        <h2>Ordered List (ol) Example: </h2>
        <ol class="ordered-list">
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ol>
    </body>
</html>
